global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "homelab-server"

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.0.2.1"] # Documentation placeholder; replace in local config
        labels:
          target_name: "router"
      - targets: ["1.1.1.1"]
        labels:
          target_name: "internet-connectivity"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [target_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://jellyfin.example.invalid:8096/"]
        labels:
          target_name: "jellyfin"
      - targets: ["http://opportunity-radar.example.invalid:18080/"]
        labels:
          target_name: "opportunity-radar"
      - targets: ["http://qbittorrent.example.invalid:8085/"]
        labels:
          target_name: "qbittorrent"
      - targets: ["http://prowlarr.example.invalid:9696/"]
        labels:
          target_name: "prowlarr"
      - targets: ["http://seerr.example.invalid:5055/"]
        labels:
          target_name: "seerr"
      - targets: ["http://sonarr.example.invalid:8989/"]
        labels:
          target_name: "sonarr"
      - targets: ["http://radarr.example.invalid:7878/"]
        labels:
          target_name: "radarr"
      - targets: ["http://bazarr.example.invalid:6767/"]
        labels:
          target_name: "bazarr"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [target_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
