global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "homelab-server"

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["${ROUTER_PROBE_TARGET}"]
        labels:
          target_name: "router"
      - targets: ["${INTERNET_CONNECTIVITY_TARGET}"]
        labels:
          target_name: "internet-connectivity"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [target_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["${JELLYFIN_TARGET_URL}"]
        labels:
          target_name: "jellyfin"
      - targets: ["${OPPORTUNITY_RADAR_TARGET_URL}"]
        labels:
          target_name: "opportunity-radar"
      - targets: ["${QBITTORRENT_TARGET_URL}"]
        labels:
          target_name: "qbittorrent"
      - targets: ["${PROWLARR_TARGET_URL}"]
        labels:
          target_name: "prowlarr"
      - targets: ["${SEERR_TARGET_URL}"]
        labels:
          target_name: "seerr"
      - targets: ["${SONARR_TARGET_URL}"]
        labels:
          target_name: "sonarr"
      - targets: ["${RADARR_TARGET_URL}"]
        labels:
          target_name: "radarr"
      - targets: ["${BAZARR_TARGET_URL}"]
        labels:
          target_name: "bazarr"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [target_name]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
