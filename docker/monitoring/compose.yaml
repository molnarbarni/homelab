services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    expose:
      - "9090"
    ports:
      - "100.64.72.18:9090:9090"
    mem_limit: 768m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    networks:
      - monitoring
    expose:
      - "9100"
    pid: host
    mem_limit: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --disable_metrics=disk
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    expose:
      - "8080"
    mem_limit: 256m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: monitoring-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cap_add:
      - NET_RAW
    networks:
      - monitoring
    expose:
      - "9115"
    mem_limit: 128m

  grafana:
    image: grafana/grafana:12.1.1
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "100.64.72.18:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
    mem_limit: 384m

networks:
  monitoring:
    name: homelab-monitoring
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
